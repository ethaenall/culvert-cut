model: Qwen/Qwen2.5-0.5B-Instruct
train: true
data: data/specialist
fine_tune_type: lora
num_layers: -1
batch_size: 4
iters: 770
learning_rate: 0.0002
max_seq_length: 768
mask_prompt: true
steps_per_report: 10
steps_per_eval: 100
val_batches: 5
save_every: 100
adapter_path: adapter/mlx
seed: 2026
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]
